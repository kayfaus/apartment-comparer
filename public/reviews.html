<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviews | Carolina Cribs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>

  <main>
    <h1 class="headline">Reviews</h1>
    <p class="muted">See what USC students really think about where they live.</p>

    <div class="side-layout">
      <div id="review-apartments" class="side-list"></div>

      <section>
        <h2 id="selected-name">Select an apartment</h2>
        <p id="avg-rating" class="stars"></p>

        <form id="review-form" class="review-form" hidden>
          <input id="author" placeholder="Your name" required>
          <select id="rating" required>
            <option value="5">★★★★★ 5</option>
            <option value="4">★★★★☆ 4</option>
            <option value="3">★★★☆☆ 3</option>
            <option value="2">★★☆☆☆ 2</option>
            <option value="1">★☆☆☆☆ 1</option>
          </select>
          <textarea id="comment" placeholder="Write your review..." required></textarea>
          <button type="submit">Post Review</button>
        </form>

        <div id="review-list"></div>
      </section>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="reviews.js"></script>
</body>
</html>
